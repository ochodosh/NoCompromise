# formalization.yaml (v0.4).

version: "v0.4"

project:
  name: "NoCompromise"
  description: >-
    A complete Lean 4 / Mathlib formalization of the main results of Chodosh and Gianocca,
    "No compromise in the liquid drop model" (arXiv:2608.11517). For Gamow's liquid-drop energy
    E(Ω) = P(Ω) + (1/2) ∫_Ω ∫_Ω |x - y|⁻¹ dx dy on sets Ω ⊆ ℝ³ of volume V, with
    V_* = 5 (2 - 2^{2/3}) / (2^{2/3} - 1): if 0 < V ≤ V_*, the minimisers are exactly the balls
    of volume V (up to null sets), and if V > V_* there is no minimiser. The binding-energy
    corollary is also proved: the optimal energy per unit volume is 3 (9π/5)^{1/3}, it is
    attained, and every optimiser is a ball of volume 5/2 up to a null set. The development is
    self-contained over Mathlib, including the required BV, geometric measure theory,
    regularity and elliptic PDE theory.
  authors: ["Otis Chodosh"]
  responsible_maintainers: ["Otis Chodosh"]
  license: "Apache-2.0"

sources:
  - title: "No compromise in the liquid drop model"
    authors: ["Otis Chodosh", "Matilde Gianocca"]
    contributors: []
    id: "arXiv:2608.11517"
    type: "article"
    location: "Theorem 1.1 and Corollary 1.2"
    relationship: "formalizes"
    note: >-
      The formalization follows a Lean-oriented blueprint of the paper's proof (blueprint/ in this
      repository), written by AI agents. The theorem statements were checked against the paper;
      the proofs were not (see fidelity). The formalization is by Otis Chodosh, an author of the
      paper; the coauthor, Matilde Gianocca, has not been contacted.
    license: "CC-BY-4.0"
    author_endorsement: "not-contacted"

related_formalizations: []

