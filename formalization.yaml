fidelity:
  divergences: |
    1. Positive volume. Theorem 1.1 is stated for V > 0 explicitly; the paper leaves this
       implicit.
    2. Uniqueness. "Balls uniquely minimize" is formalized as: a set is a minimizer exactly when
       it agrees with a ball of volume V up to a null set (that is, up to translation and null
       sets).
    3. Measurability. The theorem is proved both with Borel sets and competitors (main) and with
       Lebesgue-measurable ones (main_lebesgue).
    4. Finite perimeter is part of the definition of a minimizer. For V > 0 this changes nothing,
       since a ball of volume V has finite energy.
    5. The energy. The perimeter is De Giorgi's, with C^1_c test fields bounded by 1 in the
       Euclidean norm. The Coulomb term is an integral over Omega x Omega, which equals the
       iterated integral by Tonelli. Both take values in [0, infinity].
    6. Corollary 1.2 is strengthened. Besides the value and its attainment, main_binding proves
       that every set attaining the infimum agrees with a ball of volume 5/2 up to a null set.
    7. Proof. The proof follows a blueprint of the paper's argument (blueprint/), written by AI
       agents from the paper. The blueprint was not required to follow the paper's proof, and
       the author has not systematically compared the two, so the formal proof may differ from
       the paper's argument. Only the statements were checked against the paper, in
       Challenge.lean, with the differences listed above.

review:
  status: "author-verified"
  reviewers: ["Otis Chodosh"]
  notes: >-
    Otis Chodosh, an author of the paper, read Challenge.lean line by line against Theorem 1.1
    and Corollary 1.2 on 2026-09-28, with Claude Opus 5.5 explaining the Lean notation. The
    proofs are checked by the Lean kernel and comparator rather than by human review.

alignment:
  namespace: "NoCompromise"
  statements:
    - source: "Theorem 1.1"
      lean: "NoCompromise.main"
      module: "Challenge"
      status: "proved"
      note: >-
        Borel-measurable sets and competitors. Uniqueness is stated up to translation and null
        sets, and V > 0 is an explicit hypothesis.
    - source: "Theorem 1.1"
      lean: "NoCompromise.main_lebesgue"
      module: "Challenge"
      status: "proved"
      note: "The same statement for Lebesgue-measurable sets and competitors."
    - source: "Corollary 1.2"
      lean: "NoCompromise.main_binding"
      module: "Challenge"
      status: "proved"
      note: >-
        Also proves that every set attaining the infimum agrees with a ball of volume 5/2 up to
        a null set, which Corollary 1.2 does not state.

acknowledgements: ""
