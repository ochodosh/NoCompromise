name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      # Fetches the Mathlib cache and runs `lake build` on the default targets
      # (the library, `Challenge` and `Solution`).
      - uses: leanprover/lean-action@v1
